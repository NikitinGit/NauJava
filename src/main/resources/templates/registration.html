<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<h1>Регистрация</h1>
<div th:if="${message}">
    <div th:text="${message}"></div>
</div>
<form th:action="@{/registration}" method="post">
    <div><label>Логин: <input type="text" name="login" th:value="${form.login}"/></label></div>
    <div><label>ФИО: <input type="text" name="fullName" th:value="${form.fullName}"/></label></div>
    <div><label>Email: <input type="email" name="email" th:value="${form.email}"/></label></div>
    <div><label>Пароль: <input type="password" name="password"/></label></div>
    <div><input type="submit" value="Зарегистрироваться"/></div>
</form>
<p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</body>
</html>
