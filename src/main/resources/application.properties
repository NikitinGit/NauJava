spring.application.name=NauJava

app.name=ProjectManager
app.version=0.1.0
# консольный ввод из практики 3; включается при запуске параметром --app.console.enabled=true
app.console.enabled=false

management.endpoints.web.exposure.include=*

# тексты сообщений об ошибках: src/main/resources/messages/messages.properties
spring.messages.basename=messages/messages
# иначе при отсутствии messages_<язык ОС>.properties Spring сначала искал бы бандл по локали ОС, а не базовый файл
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:postgresql://localhost:5432/naujava
spring.datasource.username=naujava
# пароль не хранится в репозитории: задаётся переменной окружения DB_PASSWORD
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
